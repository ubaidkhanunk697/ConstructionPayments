<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="paidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Construction Building Structure -->
  <g filter="url(#shadow)">
    <!-- Architectural Gable Roof -->
    <path d="M32 11 L14 25 L18 28 L32 17 L46 28 L50 25 Z" fill="url(#roofGrad)" />
    
    <!-- Left Wing -->
    <rect x="18" y="27" width="11" height="23" rx="1" fill="#DBEAFE" />
    <rect x="21.5" y="31" width="4" height="4" rx="0.8" fill="#2563EB" />
    <rect x="21.5" y="38" width="4" height="4" rx="0.8" fill="#2563EB" />

    <!-- Center Main Tower / Facade -->
    <rect x="27" y="19" width="10" height="31" rx="1" fill="#FFFFFF" />
    <rect x="30" y="23" width="4" height="4" rx="0.8" fill="#1D4ED8" />
    <rect x="30" y="30" width="4" height="4" rx="0.8" fill="#1D4ED8" />
    <rect x="30" y="37" width="4" height="4" rx="0.8" fill="#1D4ED8" />
    <path d="M29.5 44 H34.5 V50 H29.5 Z" fill="#2563EB" />

    <!-- Right Wing -->
    <rect x="35" y="27" width="11" height="23" rx="1" fill="#DBEAFE" />
    <rect x="38.5" y="31" width="4" height="4" rx="0.8" fill="#2563EB" />
  </g>

  <!-- Financial / Payment Verified Emerald Badge -->
  <g filter="url(#shadow)">
    <circle cx="47" cy="45" r="11" fill="url(#paidGrad)" stroke="#FFFFFF" stroke-width="2.2" />
    <path d="M42.5 45 L45.5 48 L51.5 42" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
