<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login - Construction Material &amp; Payment System</title>
  
  <meta name="description" content="Secure single-owner Google authentication for the Construction Material & Payment System.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="assets/favicon.svg">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase Official JavaScript Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Modular Stylesheets (Guaranteed compatibility with file:// and http://) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: radial-gradient(circle at 50% 30%, #E8F1F9 0%, #F0F4F8 100%);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      padding: var(--space-8) var(--space-6);
      text-align: center;
      position: relative;
    }

    .login-brand-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary), #1D4ED8);
      color: var(--color-text-white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-4);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      padding: 0.75rem 1rem;
      background-color: var(--color-surface);
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-main);
      box-shadow: var(--shadow-sm);
      transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
      margin: var(--space-4) 0;
      position: relative;
    }

    .google-btn:hover:not(:disabled) {
      background-color: var(--color-surface-hover);
      border-color: #94A3B8;
      box-shadow: var(--shadow-md);
    }

    .google-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .google-icon-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .security-notice-box {
      background-color: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      text-align: left;
      display: flex;
      gap: var(--space-2);
      align-items: flex-start;
      margin-top: var(--space-4);
    }

    .security-notice-box i {
      color: var(--color-primary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Auth Alerts */
    .auth-alert {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      text-align: left;
      display: flex;
      gap: var(--space-2);
      align-items: flex-start;
      margin-bottom: var(--space-4);
      animation: alertFadeIn 200ms ease forwards;
    }

    .auth-alert-danger {
      background-color: var(--color-pending-subtle);
      border: 1px solid var(--color-pending-border);
      color: var(--color-pending-hover);
    }

    .auth-alert-warning {
      background-color: var(--color-warning-subtle);
      border: 1px solid #FCD34D;
      color: #92400E;
    }

    .auth-alert-info {
      background-color: var(--color-primary-subtle);
      border: 1px solid var(--color-primary-border);
      color: var(--color-primary-hover);
    }

    .auth-alert-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #CBD5E1;
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 600ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes alertFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="login-wrapper">

  <div class="login-container">
    <div class="card-glass login-card">
      
      <!-- Brand Icon -->
      <div class="login-brand-icon">
        <i data-lucide="shield-check" style="width: 28px; height: 28px;"></i>
      </div>

      <h1 style="font-size: var(--font-size-lg); margin-bottom: 4px;">
        Owner Authentication
      </h1>
      <p style="font-size: var(--font-size-xs); color: var(--color-text-dim); margin-bottom: var(--space-4);">
        Construction Material &amp; Payment System
      </p>

      <!-- Alert Banners -->
      <div id="auth-alert-container"></div>

      <!-- Auth Message Status Container -->
      <div id="auth-message" style="margin-bottom: var(--space-3); font-size: var(--font-size-xs); color: var(--color-text-dim); display: none;"></div>

      <!-- Google OAuth Sign-In Button -->
      <button type="button" id="google-login" data-alias="btn-google-login" class="google-btn">
        <svg class="google-icon-svg" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="btn-google-text">Continue with Google</span>
        <div id="btn-google-spinner" class="spinner" style="display: none;"></div>
      </button>

      <!-- Security Notice Box -->
      <div class="security-notice-box">
        <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
        <div>
          <strong style="color: var(--color-text-main); display: block; margin-bottom: 2px;">
            Single-Owner Access Only
          </strong>
          Only the authorized project owner's Google account can access this system. Public registration is disabled. All unapproved logins are instantly rejected.
        </div>
      </div>

      <div style="margin-top: var(--space-6); text-align: center;">
        <a href="index.html" style="font-size: var(--font-size-xs); color: var(--color-text-dim);">
          &larr; Return to System Overview
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Configuration & Authentication Scripts -->
  <!-- Optional local env override -->
  <script src="js/env.js" onerror="/* env.js is optional; fallback to config.js */"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }

      const alertContainer = document.getElementById("auth-alert-container");
      const googleBtn = document.getElementById("google-login") || document.getElementById("btn-google-login");
      const btnText = document.getElementById("btn-google-text");
      const btnSpinner = document.getElementById("btn-google-spinner");
      const authMessage = document.getElementById("auth-message");

      function showAlert(type, title, message) {
        const icons = {
          danger: "shield-alert",
          warning: "alert-triangle",
          info: "info"
        };
        const alertEl = document.createElement("div");
        alertEl.className = `auth-alert auth-alert-${type}`;
        alertEl.innerHTML = `
          <i data-lucide="${icons[type] || 'info'}" class="auth-alert-icon" style="width: 18px; height: 18px;"></i>
          <div>
            <strong style="display: block; margin-bottom: 2px;">${title}</strong>
            <div>${message}</div>
          </div>
        `;
        alertContainer.appendChild(alertEl);
        if (window.lucide) window.lucide.createIcons();
      }

      // Check URL parameters for status/errors
      const params = new URLSearchParams(window.location.search);
      const hash = window.location.hash;

      if (params.get("error") === "unauthorized") {
        const attempted = params.get("attempted") || "your account";
        showAlert(
          "danger",
          "Access Denied: Unauthorized Account",
          `Google account <strong>${attempted}</strong> is not approved to access this system. Only the designated project owner has access.`
        );
      } else if (params.get("notice") === "logged_out") {
        showAlert(
          "info",
          "Signed Out",
          "You have been successfully and securely logged out."
        );
      } else if (params.get("reason") === "session_expired") {
        showAlert(
          "warning",
          "Session Expired",
          "Your authentication session has expired. Please sign in again with Google."
        );
      } else if (params.get("reason") === "unauthenticated") {
        showAlert(
          "info",
          "Sign In Required",
          "Please sign in with the approved Google owner account to view project records."
        );
      }

      // Check for OAuth hash errors
      if (hash && hash.includes("error=")) {
        const hashParams = new URLSearchParams(hash.substring(1));
        const desc = hashParams.get("error_description") || "Authentication could not be completed.";
        showAlert("danger", "Authentication Error", desc);
      }

      // Check if Supabase configuration is present
      if (!CONFIG.isConfigured()) {
        showAlert(
          "warning",
          "Supabase Setup Required",
          "Supabase credentials have not been configured yet. Copy <code>js/env.template.js</code> to <code>js/env.js</code> and enter your Supabase URL, publishable key, and owner email."
        );
      }

      // If user is already authenticated and authorized, redirect to dashboard
      await Auth.redirectIfAuthenticated();

      // Bind Continue with Google click
      if (googleBtn) {
        googleBtn.addEventListener("click", async () => {
          if (!CONFIG.isConfigured()) {
            UI.showToast(
              "Please configure your Supabase Project URL and Anon Key in js/env.js before authenticating.",
              "warning",
              "Configuration Missing"
            );
            return;
          }

          try {
            googleBtn.disabled = true;
            btnText.textContent = "Redirecting to Google...";
            if (authMessage) {
              authMessage.textContent = "Redirecting to Google...";
              authMessage.style.display = "block";
              authMessage.style.color = "var(--color-text-dim)";
            }
            btnSpinner.style.display = "block";

            await Auth.signInWithGoogle();
          } catch (err) {
            console.error("Google sign in error:", err);
            googleBtn.disabled = false;
            btnText.textContent = "Continue with Google";
            if (authMessage) {
              authMessage.textContent = err.message || "Failed to initiate Google sign in.";
              authMessage.style.display = "block";
              authMessage.style.color = "var(--color-pending)";
            }
            btnSpinner.style.display = "none";
            UI.showToast(err.message || "Failed to initiate Google sign in.", "error", "OAuth Error");
          }
        });
      }
    });
  </script>
</body>
</html>
